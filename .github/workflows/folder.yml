name: Folder refresh
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch folder deals
        run: python refresh_folder.py
      - name: Commit if changed
        run: |
          git config user.name "weate-folder"
          git config user.email "weate@users.noreply.github.com"
          git add bonus.json folder-*.json folder-index.json
          git diff --cached --quiet && echo "geen wijziging" && exit 0
          git commit -m "Folder + acties automatisch $(date -u +%F)"
          git push
